name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Sensitive-information scan
        run: npm run scan:secrets
